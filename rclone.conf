# 1. 統一的 pCloud 遠端
[my_pcloud_account]
type = pcloud
hostname = api.pcloud.com
token = {"access_token":"the-access-token","token_type":"bearer","expiry":"0001-01-01T00:00:00Z"}
username = my_pcloud_account@my-email.com
password = the-password-hash

# 2. 核心 Union 配置：將本地 SSD 緩衝區與雲端唯讀層合併
[union]
type = union
# 本地路徑：正常讀寫
# 雲端路徑：標記為 :ro (唯讀) 且 :nc (不建立新檔)
upstreams = /cloud/cache/juicy_chunks_local my_pcloud_account:/rclone/juicy_chunks:nc
# 搜尋策略：ff (First Found)，優先找本地
search_policy = ff
# 寫入/建立策略：epff (Existing Path, First Found)
# 配合背景搬運腳本，這能確保所有新產生的碎塊都先寫入 /cloud/cache/juicy_chunks_local
action_policy = epff
create_policy = epff
# 快取設定 (選配)
cache_time = 120

